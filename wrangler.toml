name = "car-board"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Create the database once with `npx wrangler d1 create car-board`
# and paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "car-board"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
